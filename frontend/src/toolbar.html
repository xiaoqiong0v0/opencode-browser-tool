<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bt-shell toolbar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* 主题变量:深色为默认,data-theme="light" 切浅色(由 theme.ts 按系统/手动设置) */
      :root, [data-theme="dark"] {
        --bg: #141414; --fg: #ddd;
        --btn-bg: #3a3a3a; --btn-fg: #ccc; --btn-hover: #454545;
        --border: #4a4a4a; --accent: #4caf50;
      }
      [data-theme="light"] {
        --bg: #f0f0f0; --fg: #333;
        --btn-bg: #e6e6e6; --btn-fg: #555; --btn-hover: #ddd;
        --border: #ccc; --accent: #2e7d32;
      }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg);
        font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      /* 第一行:标签(高度仅由标签决定,使激活标签底部紧贴地址行) */
      #tab-row {
        display: flex; align-items: flex-start; gap: 4px;
        padding: 4px 4px 0; position: relative;
        min-height: 0;
      }
      /* 标签行所有子元素底部留 4px 间距 */
      #tab-row > * { margin-bottom: 4px; }
      /* 窗口控制按钮:flex 布局放标签行右侧(高度≤标签,不撑高标签行) */
      #win-btns {
        display: flex; align-items: center; margin-left: auto;
      }
      .win-btn {
        flex-shrink: 0; width: 40px; height: 24px; border-radius: 5px;
        display: flex; align-items: center; justify-content: center;
        color: var(--btn-fg); cursor: pointer; font-size: 13px; line-height: 1;
      }
      .win-btn:hover { background: var(--btn-hover); }
      #win-close:hover { background: #e81123; color: #fff; }
      .fold-btn {
        flex-shrink: 0; width: 22px; height: 24px; border-radius: 5px;
        display: flex; align-items: center; justify-content: center;
        color: var(--btn-fg); cursor: pointer; font-size: 12px; line-height: 1;
      }
      .fold-btn:hover { background: var(--btn-hover); }
      #tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 0 1 auto; margin-bottom: 0; }
      #tabs::-webkit-scrollbar { height: 0; }
      /* 可拖动空白:占满标签行剩余空间,用于无标题栏窗口拖动 */
      #drag-zone { flex: 1; align-self: stretch; min-width: 48px; }
      /* 标签:高度撑满,flex column 布局(tab-top 三元素 + tab-link 连接条) */
      .tab {
        height: 100%; position: relative; flex-shrink: 0;
        display: flex; flex-direction: column;
      }
      /* 标签主体:图标/标题/x 包起来,应用现有胶囊样式 */
      .tab-top {
        display: flex; align-items: center; gap: 6px;
        height: 24px; max-width: 170px; min-width: 70px;
        padding: 0 8px; box-sizing: border-box;
        border-radius: 7px;
        background: color-mix(in srgb, var(--bg) 90%, var(--fg) 5%); color: var(--btn-fg);
        white-space: nowrap; cursor: pointer;
      }
      .tab-top:hover { background: color-mix(in srgb, var(--bg) 80%, var(--fg) 8%); }
      /* 激活标签:与地址行同色,底部圆角去掉 */
      .tab.active .tab-top {
        background: var(--btn-bg); color: var(--fg);
        border-radius: 7px 7px 0 0;
      }
      /* 底部连接条:普通流占 tab 底部 3px,激活时显示同色块(在 tab 内,不被 overflow 裁) */
      .tab-link {
        display: none;
        height: 4px;
        background: var(--btn-bg);
      }
      .tab.active .tab-link { display: block; }
      .tab-fav {
        flex-shrink: 0; width: 14px; height: 14px; border-radius: 2px;
        background: color-mix(in srgb, var(--bg) 70%, var(--fg) 10%);
        display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1;
      }
      .tab-title { overflow: hidden; text-overflow: ellipsis; line-height: 1; }
      .tab-close {
        flex-shrink: 0; width: 15px; height: 15px; line-height: 1; text-align: center;
        border-radius: 3px; color: var(--btn-fg); font-size: 12px;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .tab-close:hover { background: #e81123; color: #fff; }
      #btn-add {
        flex-shrink: 0; width: 22px; height: 24px; border-radius: 5px;
        display: flex; align-items: center; justify-content: center;
        background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; font-size: 15px; line-height: 1;
      }
      #btn-add:hover { background: var(--btn-hover); }
      /* 第二行:导航 */
      #nav-row {
        display: flex; align-items: center; gap: 6px; padding: 5px 8px;
        background: var(--btn-bg); /* 底部直角,不要圆角 */
      }
      .nav-btn {
        flex-shrink: 0; width: 30px; height: 26px; border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--btn-bg) 80%, var(--fg) 10%); color: var(--btn-fg); cursor: pointer; font-size: 14px;
      }
      .nav-btn:hover { background: var(--btn-hover); }
      /* 地址栏容器:占满剩余宽度,清空按钮绝对定位在其内部(不占流内空间,窄模式不挤压、不换行) */
      .addr-wrap { position: relative; flex: 1; min-width: 60px; display: flex; align-items: center; }
      #addr {
        flex: 1; width: 100%; min-width: 0; padding: 5px 26px 5px 10px; border: 1px solid var(--border);
        border-radius: 14px; /* 输入框保留胶囊圆角 */
        background: var(--bg); color: var(--btn-fg); font: 13px system-ui; outline: none;
        transition: color 0.15s, border-color 0.15s;
      }
      #addr:focus { color: var(--fg); border-color: var(--accent); }
      /* 清空按钮:仅在有输入时显示(JS 置 hidden),点击清空并聚焦 */
      .addr-clear {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--bg) 70%, var(--fg) 25%); color: var(--btn-fg);
        cursor: pointer; opacity: 0.75;
      }
      .addr-clear:hover { opacity: 1; background: var(--btn-hover); }
      .addr-clear[hidden] { display: none; }
      .addr-clear svg { width: 10px; height: 10px; }
      #btn-panel {
        flex-shrink: 0; padding: 5px 10px; border: 1px solid var(--border); border-radius: 14px;
        background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; font: 13px system-ui;
        display: inline-flex; align-items: center; gap: 4px;
      }
      #btn-panel:hover { background: var(--btn-hover); }
      #btn-panel.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      /* 批注/截图快捷按钮(⚙ 面板按钮左侧,免开面板直接操作) */
      .tool-btn {
        flex-shrink: 0; padding: 4px 10px; border: 1px solid var(--border); border-radius: 14px;
        background: color-mix(in srgb, var(--btn-bg) 80%, var(--fg) 10%); color: var(--btn-fg);
        cursor: pointer; font: 13px system-ui; display: flex; align-items: center; gap: 4px;
      }
      .tool-btn svg { width: 14px; height: 14px; }
      .tool-btn:hover { background: var(--btn-hover); }
      .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      /* 下载按钮数字角标:绝对定位在按钮右上角(不占流内空间,不撑宽按钮、不撑高导航行),
         仅显示进行中数量;数量为 0 时由 JS 置 hidden 隐藏。
         z-index 让角标盖住右侧相邻的「面板」按钮,避免 99+ 时被其背景遮挡 */
      #btn-downloads { position: relative; z-index: 1; }
      .dl-badge {
        position: absolute; top: -5px; right: -5px;
        min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 8px; background: #e81123; color: #fff;
        font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0;
        pointer-events: none; /* 角标不拦截点击,点角标等同点按钮 */
      }
      .dl-badge[hidden] { display: none; }
      /* 新下载开始:角标脉冲 1s(时长与 toolbar.ts 的 BADGE_PULSE_MS 同步维护) */
      @keyframes dl-badge-pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 17, 35, 0.7); }
        50% { transform: scale(1.35); }
        100% { transform: scale(1); box-shadow: 0 0 0 6px rgba(232, 17, 35, 0); }
      }
      .dl-badge.pulse { animation: dl-badge-pulse 1s ease-out; }
      /* 窄模式(工具栏 webview 宽=窗口逻辑宽):批注/截图/下载/面板按钮去文字只留图标,避免 nav-row 溢出。
         阈值与 Rust `ui::NARROW_MODE_MAX_W`(480) 同步维护:Rust 侧 win_w < 480 → 面板填满 + 本媒体查询生效
         注意:角标不是 .btn-label,窄模式下仍然显示 */
      @media (max-width: 479px) {
        .btn-label { display: none; }
      }
      /* lucide 图标尺寸:对齐各按钮原有符号的视觉大小,颜色随 currentColor 继承 */
      .win-btn svg { width: 12px; height: 12px; }
      .fold-btn svg { width: 14px; height: 14px; }
      #btn-add svg { width: 14px; height: 14px; }
      .nav-btn svg { width: 16px; height: 16px; }
      .tab-fav svg { width: 12px; height: 12px; }
      .tab-close svg { width: 12px; height: 12px; }
      #btn-panel svg { width: 14px; height: 14px; }
    </style>
  </head>
  <body>
    <div id="tab-row" data-tauri-drag-region>
      <div id="tab-scroll-left" class="fold-btn" title="更多标签"><i data-lucide="chevron-left"></i></div>
      <div id="tabs"></div>
      <div id="tab-scroll-right" class="fold-btn" title="更多标签"><i data-lucide="chevron-right"></i></div>
      <div id="btn-add" title="新建标签"><i data-lucide="plus"></i></div>
      <div id="drag-zone" data-tauri-drag-region></div>
      <div id="win-btns">
        <div id="win-min" class="win-btn" title="最小化"><i data-lucide="minus"></i></div>
        <div id="win-max" class="win-btn" title="最大化"><i data-lucide="square"></i></div>
        <div id="win-close" class="win-btn" title="关闭"><i data-lucide="x"></i></div>
      </div>
    </div>
    <div id="nav-row">
      <div id="btn-back" class="nav-btn" title="后退"><i data-lucide="arrow-left"></i></div>
      <div id="btn-forward" class="nav-btn" title="前进"><i data-lucide="arrow-right"></i></div>
      <div id="btn-reload" class="nav-btn" title="刷新"><i data-lucide="rotate-cw"></i></div>
      <!-- 地址栏:清空按钮(×)叠在输入框右侧;有内容时显示,空时隐藏 -->
      <div class="addr-wrap">
        <input id="addr" placeholder="输入地址，回车导航" spellcheck="false" />
        <button id="addr-clear" class="addr-clear" type="button" hidden title="清空地址栏" aria-label="清空地址栏">
          <i data-lucide="x"></i>
        </button>
      </div>
      <!-- 批注/截图/下载/面板:文字包 span.btn-label(窄模式媒体查询隐藏;裸文本节点无法用 CSS 隐藏) -->
      <button id="btn-annotate" class="tool-btn" title="批注模式(点击元素标注)"><i data-lucide="pen-line"></i><span class="btn-label">批注</span></button>
      <button id="btn-shot" class="tool-btn" title="立即截图"><i data-lucide="camera"></i><span class="btn-label">截图</span></button>
      <!-- 下载:角标显示进行中数量;点击由 Rust 显示面板并切到下载视图(不在工具栏做下拉) -->
      <button id="btn-downloads" class="tool-btn" title="下载"><i data-lucide="download"></i><span class="btn-label">下载</span><span id="dl-badge" class="dl-badge" hidden></span></button>
      <button id="btn-panel" title="功能面板"><i data-lucide="settings"></i><span class="btn-label">面板</span></button>
    </div>
    <script src="toolbar.js"></script>
  </body>
</html>
