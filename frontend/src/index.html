<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bt-shell 面板</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* 主题变量:深色为默认,data-theme="light" 切浅色(由 theme.ts 按系统/手动设置) */
      :root, [data-theme="dark"] {
        --bg: #1e1e1e; --fg: #ddd; --fg-dim: #aaa;
        --panel-bg: #2a2a2a; --panel-hover: #333; --rec-bg: #242424;
        --border: #444; --rec-border: #333; --muted: #888; --empty: #666;
        --accent: #4caf50; --accent-active: #3d5a3d; --accent-blue: #3b5bdb;
      }
      [data-theme="light"] {
        --bg: #f5f5f5; --fg: #333; --fg-dim: #666;
        --panel-bg: #fff; --panel-hover: #ececec; --rec-bg: #fff;
        --border: #d0d0d0; --rec-border: #e0e0e0; --muted: #888; --empty: #999;
        --accent: #2e7d32; --accent-active: #c8e6c9; --accent-blue: #2f52c4;
      }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        user-select: none;
      }
      h3 { font-size: 14px; color: var(--fg-dim); font-weight: 600; }
      button {
        padding: 8px 0;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel-bg);
        color: var(--fg);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      button svg { width: 16px; height: 16px; }
      button:hover { background: var(--panel-hover); }
      button.active { background: var(--accent-active); border-color: var(--accent); }
      select {
        width: 100%;
        padding: 6px;
        background: var(--panel-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 13px;
      }
      .row { display: flex; gap: 6px; }
      .row > button { flex: 1; }
      .head { display: flex; align-items: center; justify-content: space-between; }
      #btn-panel-close {
        width: 24px; padding: 0; height: 22px; border-radius: 4px;
        border: 1px solid var(--border); background: var(--panel-bg); color: var(--muted); cursor: pointer;
      }
      #btn-panel-close svg { width: 14px; height: 14px; }
      #btn-panel-close:hover { background: var(--panel-hover); color: var(--fg); }
      /* 顶部导航 tab(导航样式:下划线指示激活,非功能按钮) */
      .tabs { display: flex; border-bottom: 1px solid var(--border); }
      .tab-btn {
        flex: 1; padding: 8px 0; font-weight: 600; color: var(--fg-dim);
        background: transparent; border: none; border-radius: 0;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      .tab-btn:hover { background: var(--panel-hover); color: var(--fg); }
      .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }
      .pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      .pane[hidden] { display: none; }
      #tab-ai-pane { flex: 1; }
      .pane-head { display: flex; align-items: center; justify-content: space-between; }
      /* AI 功能页内的视图切换(记录 / 下载):段控件风格,外观复用面板按钮 */
      .view-nav { display: flex; gap: 6px; flex-shrink: 0; }
      .view-nav-btn {
        flex: 1; min-width: 0; padding: 6px 0; font-size: 12px; font-weight: 600;
        color: var(--fg-dim); white-space: nowrap;
      }
      .view-nav-btn.active { color: var(--fg); background: var(--accent-active); border-color: var(--accent); }
      /* 视图容器:占满内容区剩余高度,同一时刻只有一个可见 */
      .view-pane { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
      .view-pane[hidden] { display: none; }
      /* 顶部功能按钮:批注 + 截图 */
      #btn-shot.active { background: var(--accent-active); border-color: var(--accent-blue); }
      #records {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px;
        padding-right: 4px;
        background: var(--rec-bg);
      }
      /* 自定义滚动条:细窄、圆角、主题适配 */
      #records::-webkit-scrollbar {
        width: 8px;
      }
      #records::-webkit-scrollbar-track {
        background: transparent;
      }
      #records::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      #records::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
        border: 2px solid transparent;
        background-clip: content-box;
      }
      /* Firefox */
      #records {
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      /* 每条记录独立卡片:分隔清晰 */
      .rec {
        padding: 8px;
        border-radius: 6px;
        background: var(--panel-bg);
        border: 1px solid var(--rec-border);
        margin-bottom: 8px;
        word-break: break-all;
      }
      .rec:last-child { margin-bottom: 0; }
      .rec-head { display: flex; align-items: center; gap: 6px; }
      .rec-tag {
        font-size: 11px; padding: 1px 5px; border-radius: 3px; color: #fff; flex-shrink: 0;
      }
      .rec-tag.annotate { background: #4a6d5a; }
      .rec-tag.screenshot { background: #3b5bdb; }
      .rec-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rec-url { color: var(--muted); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rec-note { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .rec-thumb { max-width: 100%; border-radius: 4px; margin-top: 4px; border: 1px solid var(--rec-border); }
      .empty { color: var(--empty); text-align: center; padding: 20px 0; }
      #btn-send { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
      #btn-send:hover { filter: brightness(1.1); }
      /* 统一通知气泡(与批注/截图一致) */
      #toast {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        padding: 8px 16px; border-radius: 6px; font: 13px system-ui, sans-serif;
        color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.25s;
        z-index: 12000; max-width: 70%; word-break: break-all;
      }
      #toast.show { opacity: 1; }
      #toast.ok { background: rgba(16, 163, 127, 0.92); }
      #toast.bad { background: rgba(245, 158, 11, 0.92); }
      #toast.err { background: rgba(220, 38, 38, 0.92); }
      /* 下载视图:按目录分组、每组默认收起;组内每行文件名/进度/大小/状态/来源
         (外层 #view-downloads-pane 已是 flex 列容器,列表占据剩余高度) */
      .dl-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      .dl-title { font-size: 13px; font-weight: 600; color: var(--fg-dim); }
      .dl-count {
        font-size: 11px; color: var(--muted); border: 1px solid var(--border);
        border-radius: 9px; padding: 0 6px; background: var(--panel-bg);
      }
      .dl-list { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; overflow-y: auto; }
      .dl-empty { color: var(--empty); text-align: center; padding: 8px 0; font-size: 12px; }
      .dl-group { border: 1px solid var(--rec-border); border-radius: 6px; background: var(--rec-bg); overflow: hidden; }
      .dl-group-head {
        width: 100%; padding: 6px 8px; background: transparent; border: none; border-radius: 0;
        justify-content: flex-start; gap: 6px; font-size: 12px; color: var(--fg);
      }
      .dl-group-head:hover { background: var(--panel-hover); }
      .dl-caret { width: 10px; flex-shrink: 0; color: var(--muted); transition: transform 0.15s; }
      .dl-group.open .dl-caret { transform: rotate(90deg); }
      .dl-dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
      .dl-num { font-size: 11px; color: var(--muted); flex-shrink: 0; }
      .dl-group-body { border-top: 1px solid var(--rec-border); }
      .dl-group-body[hidden] { display: none; }
      .dl-row { padding: 6px 8px; border-bottom: 1px solid var(--rec-border); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .dl-row:last-child { border-bottom: none; }
      .dl-row-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
      .dl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .dl-size { font-size: 11px; color: var(--muted); flex-shrink: 0; }
      .dl-bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
      .dl-bar-fill { height: 100%; width: 0; background: var(--accent-blue); transition: width 0.2s; }
      .dl-bar.indeterminate .dl-bar-fill { width: 35%; animation: dl-slide 1.1s ease-in-out infinite; }
      .dl-bar.done .dl-bar-fill { background: var(--accent); }
      .dl-bar.failed .dl-bar-fill { background: #c0392b; }
      @keyframes dl-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .dl-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); min-width: 0; }
      .dl-state { flex-shrink: 0; }
      .dl-state.failed { color: #e74c3c; }
      .dl-host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
      .dl-actions { display: flex; gap: 6px; }
      .dl-actions button { padding: 3px 8px; font-size: 11px; border-radius: 4px; }
      .dl-actions button:disabled { opacity: 0.5; cursor: default; }
      /* 行内删除:trash 图标 + 文字;窄屏只留图标(title/aria-label 保留说明) */
      .dl-del { display: inline-flex; align-items: center; gap: 4px; }
      .dl-del svg { width: 12px; height: 12px; flex-shrink: 0; }
      .dl-del:not(:disabled) { color: #e74c3c; }
      /* 配置页「下载」:可编辑目录输入 + 操作按钮 + 行内提示(失败为小字红色) */
      input[type="text"] {
        width: 100%;
        padding: 6px;
        background: var(--panel-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 13px;
        user-select: text;
      }
      .dl-dir-actions { display: flex; gap: 6px; }
      .dl-dir-actions > button { flex: 1; min-width: 0; }
      .dl-dir-msg { font-size: 11px; color: #e74c3c; word-break: break-all; }
      .dl-dir-msg.ok { color: var(--accent); }
      .dl-dir-msg[hidden] { display: none; }
      /* 窄模式(窗口 < 480,与 Rust `ui::NARROW_MODE_MAX_W` 及 toolbar 的 479px 媒体查询一致):
         视图导航只留图标、隐藏文字;下载行动作按钮允许换行,长文件名/路径不撑破面板 */
      @media (max-width: 479px) {
        .view-nav-label { display: none; }
        .dl-row-top { flex-wrap: wrap; }
        .dl-size { flex-shrink: 1; }
        .dl-actions { flex-wrap: wrap; }
        /* 删除按钮窄屏只留图标(说明走 title/aria-label) */
        .dl-del-label { display: none; }
        /* 目录操作按钮换行,不横向溢出;保存/恢复默认仍保留文字 */
        .dl-dir-actions { flex-wrap: wrap; }
        .dl-dir-actions > button { flex: 1 1 45%; }
      }    </style>
  </head>
  <body>
    <div class="head">
      <h3>bt-shell 面板</h3>
      <button id="btn-panel-close" title="收起面板"><i data-lucide="x"></i></button>
    </div>
    <div class="tabs">
      <button id="tab-ai" class="tab-btn active"><i data-lucide="bot"></i>AI 功能</button>
      <button id="tab-config" class="tab-btn"><i data-lucide="settings"></i>配置</button>
    </div>
    <!-- Tab1:AI 功能区(视图切换:记录 / 下载;批注/截图已移至工具栏) -->
    <div id="tab-ai-pane" class="pane">
      <!-- 视图导航:记录(默认)/ 下载;窄屏只显示图标(title + aria-label 保可访问性) -->
      <div id="view-nav" class="view-nav" role="tablist" aria-label="面板视图">
        <button id="btn-view-records" class="view-nav-btn active" type="button" role="tab"
          aria-selected="true" aria-controls="view-records-pane" title="记录" aria-label="记录">
          <i data-lucide="list"></i><span class="view-nav-label">记录</span>
        </button>
        <button id="btn-view-downloads" class="view-nav-btn" type="button" role="tab"
          aria-selected="false" aria-controls="view-downloads-pane" title="下载" aria-label="下载">
          <i data-lucide="download"></i><span class="view-nav-label">下载</span>
        </button>
      </div>
      <!-- 记录视图:批注/截图记录列表 + 发送(默认视图,行为与之前一致) -->
      <div id="view-records-pane" class="view-pane" role="tabpanel">
        <div id="records"></div>
        <button id="btn-send"><i data-lucide="send"></i>发送</button>
      </div>
      <!-- 下载视图:按目录分组、每组默认收起;空态显示「暂无下载」 -->
      <div id="view-downloads-pane" class="view-pane" role="tabpanel" hidden>
        <div class="dl-head">
          <span class="dl-title">下载</span>
          <span id="dl-count" class="dl-count">0</span>
        </div>
        <div id="dl-list" class="dl-list">
          <div class="dl-empty">暂无下载</div>
        </div>
      </div>
    </div>
    <!-- Tab2:配置区(外观放顶部) -->
    <div id="tab-config-pane" class="pane" hidden>
      <h3>外观</h3>
      <select id="theme-select">
        <option value="auto">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
      <!-- 分组拆分:设备预设(下拉)与工具(按钮)各占一组,不再挤在一个「设备 / 工具」下 -->
      <h3>设备预设</h3>
      <select id="device-select">
        <!-- 首项「默认」(value=特殊名,与 Rust devices::DEFAULT_DEVICE_NAME 一致);设备列表由 JS 追加 -->
        <option value="__default__">默认</option>
      </select>
      <!-- 下载目录:输入框预填当前目录;保存=切换、恢复默认=清持久化并回默认目录 -->
      <h3>下载</h3>
      <input
        id="download-dir-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        placeholder="下载保存目录（绝对路径）"
      />
      <div class="dl-dir-actions">
        <button id="btn-download-dir-save" type="button"><i data-lucide="save"></i>保存</button>
        <button id="btn-download-dir-reset" type="button"><i data-lucide="rotate-ccw"></i>恢复默认</button>
        <button id="btn-download-dir-open" type="button"><i data-lucide="folder-open"></i>打开文件夹</button>
      </div>
      <div id="download-dir-msg" class="dl-dir-msg" hidden></div>
      <h3>工具</h3>
      <div class="row">
        <button id="btn-devtools"><i data-lucide="wrench"></i>开发者工具</button>
      </div>
    </div>
    <!-- 统一 toast:放在两个 tab 之外,配置页也能看到(取消/删除下载的结果不受当前 tab 影响) -->
    <div id="toast"></div>
    <script src="index.js"></script>
  </body>
</html>
