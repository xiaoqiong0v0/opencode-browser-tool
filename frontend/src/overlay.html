<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bt-shell overlay</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #canvas { display: block; width: 100%; height: 100%; }
      #toast {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        padding: 8px 16px; border-radius: 6px; font: 13px system-ui, sans-serif;
        color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.25s;
        z-index: 9999; max-width: 70%; word-break: break-all;
      }
      #toast.show { opacity: 1; }
      #toast.ok { background: rgba(16, 163, 127, 0.92); }
      #toast.bad { background: rgba(245, 158, 11, 0.92); }
      #toast.err { background: rgba(220, 38, 38, 0.92); }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="toast"></div>
    <script src="overlay.js"></script>
  </body>
</html>
