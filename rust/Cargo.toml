[package]
name = "bt-shell"
version = "0.3.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["unstable", "devtools"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.0", features = ["cors"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 子 webview 绝对定位垫片:tauri/wry 在 Linux 把子 webview pack 进窗口 GtkBox,set_bounds 失效,
# 需自建 gtk::Fixed 绝对定位(版本与 Cargo.lock 中 tauri/wry 传递依赖一致)
gtk = "0.18"
webkit2gtk = "2.0"
# cairo 的 PNG 输出(Surface::write_to_png 位于 cairo-rs 的 "png" feature 下,gtk 0.18 未启用该 feature,
# 需在本目标显式开启;版本与 gtk 0.18 依赖的 cairo-rs 一致,特性为叠加,不新增独立版本)
cairo-rs = { version = "0.18", features = ["png"] }
# 截图 PNG 的 base64 编码;版本与 Cargo.lock 中既有的传递依赖 base64 0.22.1 一致,不引入新版本
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 版本与 tauri 内部依赖对齐(tauri-runtime-wry 用 webview2-com 0.38.2 / windows 0.61.3),
# 否则 PlatformWebview::controller() 返回的类型与本地代码不兼容
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Ole"] }
