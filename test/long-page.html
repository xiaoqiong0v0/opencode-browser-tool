<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>长页面测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; }
.section { padding: 60px 40px; border-bottom: 2px dashed #ccc; }
.section:nth-child(odd) { background: #f5f5f5; }
.section:nth-child(even) { background: #e8f4f8; }
h2 { margin-bottom: 20px; color: #333; }
p { line-height: 1.8; color: #555; max-width: 800px; }
.box { display: inline-block; padding: 20px 40px; margin: 20px 0; background: #2196f3; color: #fff; border-radius: 8px; cursor: pointer; }
.box:hover { background: #1976d2; }
img { max-width: 400px; border-radius: 8px; margin: 20px 0; }
input, select, textarea { display: block; margin: 10px 0; padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
footer { text-align: center; padding: 40px; color: #999; }
</style></head>
<body>
<div class="section"><h2>第一部分：开头</h2><p>这是一个超长页面，用于测试截图批注工具的滚动截图和批注功能。</p></div>
<div class="section"><h2>第二部分：图片</h2><p>这里有一些图片和交互元素，可以测试框选和批注。</p><div class="box" onclick="alert('点击了按钮')">点击我</div></div>
<div class="section"><h2>第三部分：表单</h2><input placeholder="输入框"><select><option>选项一</option><option>选项二</option></select><textarea rows="3" placeholder="文本域"></textarea></div>
<div class="section"><h2>第四部分</h2><p>这是第四部分的内容，分布在页面不同位置。批注工具需要能够滚动截取整个页面。</p></div>
<div class="section"><h2>第五部分</h2><p>更多内容...</p></div>
<div class="section"><h2>第六部分</h2><p>继续往下...</p></div>
<div class="section"><h2>第七部分</h2><p>页面很长，需要滚动才能看到底部。</p></div>
<div class="section"><h2>第八部分</h2><p>第八部分的内容。</p></div>
<div class="section"><h2>第九部分</h2><p>接近底部了。</p></div>
<div class="section"><h2>第十部分</h2><p>这是页面底部。截图工具应该能完整截取到所有部分。</p></div>
<footer>— 长页面测试结束 —</footer>
</body>
</html>
